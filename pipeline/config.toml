# co2-atlas pipeline configuration.
#
# Updating to a new Global Carbon Project release (e.g. GCB2026) should only require
# changing `gcp.zenodo_record_id` and re-running `uv run co2-pipeline build`.
# File names, version string and checksums are read from the Zenodo API.

[gcp]
zenodo_record_id = 17417124
# Codes that GCP uses for non-country rows. They are exported to aggregates.json
# and must never reach the map. XIT was split into XIA/XIS in 2023 but is kept
# here so older releases still validate.
aggregate_codes = ["WLD", "XIA", "XIS", "XIT"]
# Code of the world total used for "share of world".
world_code = "WLD"

[naturalearth]
version = "v5.1.2"
base_url = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector"
countries_file = "ne_50m_admin_0_countries.geojson"
countries_sha256 = "3e458fc036ad0a66411f2c1e6cac49c5d7bfb81cb1123bc513b22511a2b7fdeb"
map_units_file = "ne_50m_admin_0_map_units.geojson"
map_units_sha256 = "b8d421aca6e9e08e8cdf09cc26af111cc3e0deba4fe915611d58ade71e8a4db0"

[output]
dir = "../public/data"
# Years shipped to the web app (the full 1750+ range goes to emissions-full.json).
app_year_min = 1950
# Significant digits kept in exported values.
sig_digits_mt = 5
sig_digits_per_capita = 4

[topology]
# Coordinate quantization (TopoJSON transform) and Douglas-Peucker tolerance in degrees.
quantization = 100000
simplify_epsilon = 0.07
max_bytes = 300000

# ---------------------------------------------------------------------------
# Territory rules ("show what GCP reports separately")
# ---------------------------------------------------------------------------

# Natural Earth admin-0 features replaced by their map units, so that parts GCP
# treats differently get their own polygon. Key: ADM0_A3 of the admin-0 feature,
# value: GU_A3 codes of the map units that replace it.
[geo.split]
FRA = ["FXX", "GUF", "GLP", "MTQ", "REU", "MYT"]
NLD = ["NLD", "NLY"]
IOA = ["CXR", "CCK"]

# Features merged into another feature (ADM0_A3 -> target code).
[geo.dissolve]
SOL = "SOM" # Somaliland -> Somalia
CYN = "CYP" # Northern Cyprus -> Cyprus

# Codes used when Natural Earth's ISO_A3_EH is missing (-99) or would collide.
# Key: ADM0_A3 (or GU_A3 for map units).
[geo.code_overrides]
KOS = "KSV" # Kosovo: GCP uses KSV
KAS = "KAS" # Siachen Glacier: disputed, no ISO code
ATC = "ATC" # Ashmore and Cartier Is.: ISO_A3_EH would collide with Australia

# Display names. Natural Earth's NAME_EN is used by default; these follow the
# names used by the GCP dataset / UN where NAME_EN is outdated or too formal.
[geo.names]
CHN = "China"
CZE = "Czechia"
TUR = "Türkiye"
CIV = "Côte d'Ivoire"
TLS = "Timor-Leste"
FSM = "Micronesia"
CCK = "Cocos (Keeling) Islands"

# Map features without a separate GCP series. Every unmatched feature must be
# listed here, otherwise the build fails. `included_in` is only set where the GCP
# methodology (PDF accompanying the dataset) says where the emissions are counted.
[[geo.no_separate_data]]
code = "GUF"
included_in = "FRA"
reason = "French overseas region; included in France since GCB2024 (GCP methodology §2.2.18)."

