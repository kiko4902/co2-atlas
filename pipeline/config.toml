# GCP country rows that have no polygon on the 1:50m map. Every such row must be
# listed here, otherwise the build fails. Format:
#
#   [[gcp.unmapped]]
#   code = "XYZ"
#   reason = "Why the country has no polygon."
#
# With Natural Earth 1:50m and the splits above, every GCP country is mapped.
