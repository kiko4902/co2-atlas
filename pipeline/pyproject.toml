[project]
name = "co2-pipeline"
version = "1.0.0"
description = "Builds the static data files for co2-atlas from the Global Carbon Project fossil CO2 dataset and Natural Earth."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "shapely>=2.0",
    "topojson>=1.9",
]

[project.scripts]
co2-pipeline = "co2_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/co2_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
